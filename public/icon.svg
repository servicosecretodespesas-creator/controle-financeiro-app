<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Radial Canvas Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" /> <!-- Indigo 950 -->
      <stop offset="100%" stop-color="#0f172a" /> <!-- Slate 900 -->
    </radialGradient>
    
    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo 600 -->
      <stop offset="50%" stop-color="#3730A3" /> <!-- Indigo 800 -->
      <stop offset="100%" stop-color="#0F172A" /> <!-- Slate 900 -->
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" /> <!-- Amber 500 -->
      <stop offset="100%" stop-color="#D97706" /> <!-- Amber 600 -->
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" /> <!-- Cyan 500 -->
      <stop offset="100%" stop-color="#10B981" /> <!-- Emerald 500 -->
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.2" />

  <!-- Main Shield Group -->
  <g transform="translate(256, 256) scale(4.2)">
    <!-- Outer Hexagonal Shield -->
    <path
      d="M0 -50 L38 -32 V0 C38 24 21 43 0 49 C-21 43 -38 24 -38 0 V-32 L0 -50 Z"
      fill="url(#shieldGrad)"
      stroke="url(#cyanGrad)"
      stroke-width="3"
      stroke-linejoin="round"
      filter="url(#glow)"
      transform="translate(0, 2)"
    />

    <!-- Inner Security Vault Ring -->
    <path
      d="M0 -41 L30 -26 V0 C30 19 17 35 0 40 C-17 35 -30 19 -30 0 V-26 L0 -41 Z"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="1.5"
      stroke-dasharray="4 2"
      opacity="0.85"
      transform="translate(0, 2)"
    />

    <!-- Financial Growth Chart Bars -->
    <rect x="-15" y="4" width="7" height="15" rx="2" fill="url(#cyanGrad)" opacity="0.9" />
    <rect x="-3" y="-5" width="7" height="24" rx="2" fill="url(#cyanGrad)" />
    <rect x="9" y="-14" width="7" height="33" rx="2" fill="url(#goldGrad)" />

    <!-- Lock Keyhole Circle -->
    <circle cx="0" cy="-14" r="5" fill="#FFFFFF" />
    <path d="M-3 -11 L3 -11 L4.5 0 L-4.5 0 Z" fill="#FFFFFF" />

    <!-- Upward Trend Line -->
    <path
      d="M-20 10 L-6 -3 L3 4 L20 -16"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M13 -16 H20 V-9"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Top Star -->
    <polygon points="0,-46 1.8,-42.5 5,-42.5 2.5,-40 3.5,-36.5 0,-39 -3.5,-36.5 -2.5,-40 -5,-42.5 -1.8,-42.5" fill="#F59E0B" />
  </g>
</svg>
